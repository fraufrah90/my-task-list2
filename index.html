  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    /* ضبط الخطوط الأساسية وتخصيص الحركات الناعمة */
    body {
      font-family: 'Cairo', 'Tajawal', sans-serif;
      background-color: #fffbf5;
      color: #1e293b;
      overflow-x: hidden;
    }

    @keyframes gentleFloat {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-5px) rotate(3deg);
      }
    }

    @keyframes softPulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.04);
      }
    }

    @keyframes sheenSlide {
      0% {
        transform: translateX(120%) skewX(-20deg);
      }
      100% {
        transform: translateX(-220%) skewX(-20deg);
      }
    }

    .animate-float-icon {
      display: inline-block;
      animation: gentleFloat 3s ease-in-out infinite;
    }

    .animate-soft-pulse {
      animation: softPulse 2.8s ease-in-out infinite;
    }

    .task-card {
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.28s ease;
    }

    .task-card:hover {
      transform: translateY(-6px);
    }

    .link-btn {
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .link-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.04);
    }

    .link-btn:active {
      transform: scale(0.98);
    }

    .link-btn::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.32), transparent);
      transform: translateX(150%) skewX(-20deg);
      pointer-events: none;
    }

    .link-btn:hover::after {
      animation: sheenSlide 0.75s ease;
    }

    /* خلفية زخرفية خفيفة ومتناغمة */
    .bg-pattern {
      background-image:
        radial-gradient(circle at 12% 10%, rgba(251, 146, 60, 0.14) 0%, transparent 38%),
        radial-gradient(circle at 88% 15%, rgba(168, 85, 247, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 80% 85%, rgba(16, 185, 129, 0.12) 0%, transparent 42%),

    /**
     * عرض رسالة تنبيه مؤقتة داخل الصفحة بدون استخدام alert()
     */
    function showBannerMessage(message, isError = false) {
      const banner = document.getElementById("statusBanner");
      if (!banner) return;

      banner.textContent = message;
      banner.className = isError
        ? "mt-2 px-4 py-2 rounded-2xl text-sm font-bold border bg-rose-50 text-rose-700 border-rose-200 block"
        : "mt-2 px-4 py-2 rounded-2xl text-sm font-bold border bg-emerald-50 text-emerald-700 border-emerald-200 block";

      clearTimeout(window.__bannerTimer);
      window.__bannerTimer = setTimeout(() => {
        banner.classList.add("hidden");
      }, 3200);
    }

    /**
     * نسخ النص الكامل إلى الحافظة مع دعم بديل متوافق مع الإطارات المدمجة (iFrame)
     */
    function copyFormattedTasks() {
      try {
        const tempTextArea = document.createElement("textarea");
        tempTextArea.value = fullFormattedText;
        tempTextArea.setAttribute("readonly", "");
        tempTextArea.style.position = "fixed";
        tempTextArea.style.opacity = "0";
        document.body.appendChild(tempTextArea);
        tempTextArea.select();
        tempTextArea.setSelectionRange(0, tempTextArea.value.length);

        const successful = document.execCommand("copy");
        document.body.removeChild(tempTextArea);

        if (successful) {
          const btnText = document.getElementById("copyBtnText");
          const copyIcon = document.getElementById("copyIcon");
          if (btnText && copyIcon) {
            const originalText = btnText.textContent;
            const originalIcon = copyIcon.textContent;
            btnText.textContent = "تم نسخ النص الكامل بنجاح!";
            copyIcon.textContent = "✅";
            setTimeout(() => {
              btnText.textContent = originalText;
              copyIcon.textContent = originalIcon;
            }, 2200);
          }
          showBannerMessage("تم نسخ قائمة المهام والروابط بالكامل وجاهزة للصق!");
        } else {
          showBannerMessage("تعذر النسخ تلقائياً، يمكنك تحديد النص يدوياً.", true);
        }
      } catch (err) {
        showBannerMessage("حدث خطأ أثناء محاولة النسخ.", true);
      }
    }

    /**
     * بناء كروت المهام داخل شبكة الصفحة
     */
    function renderTasks() {
      const grid = document.getElementById("tasksGrid");
      if (!grid) return;

      try {
        grid.innerHTML = "";

        tasksData.forEach((task, index) => {
          const card = document.createElement("article");
          card.className = `task-card rounded-3xl border-2 p-5 sm:p-6 shadow-sm flex flex-col justify-between gap-4 ${task.cardStyle}`;

          // رأس الكارت: الرقم + الأيقونة المتحركة + اسم المهمة
          const headerDiv = document.createElement("div");
          headerDiv.className = "flex items-center justify-between gap-3";

          const titleGroup = document.createElement("div");
          titleGroup.className = "flex items-center gap-3";

          const iconSpan = document.createElement("span");
          iconSpan.className = "animate-float-icon text-3xl sm:text-4xl select-none";
          iconSpan.style.animationDelay = `${(index * 0.22).toFixed(2)}s`;
          iconSpan.textContent = task.icon;

          const textWrap = document.createElement("div");
          const numSpan = document.createElement("span");
          numSpan.className = `text-base sm:text-lg font-extrabold ml-1.5 ${task.accentColor}`;
          numSpan.textContent = task.numText;

          const h3 = document.createElement("h3");
          h3.className = "inline text-xl sm:text-2xl font-extrabold text-slate-900";
          h3.textContent = task.taskTitle;

          textWrap.appendChild(numSpan);
          textWrap.appendChild(h3);

          titleGroup.appendChild(iconSpan);
          titleGroup.appendChild(textWrap);

          const badge = document.createElement("span");
          badge.className = `text-xs font-bold px-3 py-1 rounded-full border shrink-0 ${task.badgeBg}`;
          badge.textContent = task.links.length > 1 ? `${task.links.length} روابط` : "رابط واحد";

          headerDiv.appendChild(titleGroup);
          headerDiv.appendChild(badge);

          // حاوية أزرار الروابط القابلة للنقر
          const linksContainer = document.createElement("div");
          linksContainer.className = "flex flex-col gap-2.5 pt-1";

          task.links.forEach((item) => {
            const anchor = document.createElement("a");
            anchor.href = item.url;
            anchor.target = "_blank";
            anchor.rel = "noopener noreferrer";
            anchor.className = `link-btn w-full rounded-2xl px-4 py-3.5 flex items-center justify-between gap-3 font-bold text-sm sm:text-base ${item.btnStyle}`;

            const labelSpan = document.createElement("span");
            labelSpan.className = "text-right leading-snug";
            labelSpan.textContent = item.label;

            const actionSpan = document.createElement("span");
            actionSpan.className = "shrink-0 inline-flex items-center gap-1 text-xs sm:text-sm bg-black/15 px-3 py-1 rounded-xl";
            actionSpan.innerHTML = '<span>فتح اللينك</span><span aria-hidden="true">↗</span>';

            anchor.appendChild(labelSpan);
            anchor.appendChild(actionSpan);
            linksContainer.appendChild(anchor);
          });

          card.appendChild(headerDiv);
          card.appendChild(linksContainer);
          grid.appendChild(card);
        });
      } catch (error) {
        grid.innerHTML = `
          <div class="col-span-full rounded-3xl bg-rose-50 border border-rose-200 p-6 text-center text-rose-700 font-bold">
            حدث خطأ أثناء تحميل قائمة المهام. يرجى تحديث الصفحة.
          </div>
        `;
      }
    }

    document.addEventListener("DOMContentLoaded", renderTasks);
  </script>
